name: Docker

on:
  schedule: # This will ignore change checks
    - cron: '0 0 1 * *'
  push:
    branches: [ "main", "dev" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
    paths:
      - 'hand-evaluator/**'
      - 'server/**'
      - '.github/workflows/docker-image.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'hand-evaluator/**'
      - 'server/**'
      - '.github/workflows/docker-image.yml'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and push'
        required: true
        default: 'latest'
      build_server:
        description: 'Build poker-server'
        required: true
        default: true
        type: boolean
      build_evaluator:
        description: 'Build hand-evaluator'
        required: true
        default: true
        type: boolean


env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # Publish for everything except pull requests raised from a fork
  PUSH_IMAGE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}


jobs:
  changes:
    # Checks for changes for both evaluator and server prior to running either
    # In addition to the trigger filters, this allows some flexible actions logging for diagnosis later
    # For pull requests, pushes to an open PR compare against the previous head,
    # while opening or reopening a PR compares against the target branch
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      evaluator: ${{ steps.filter.outputs.evaluator }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PREVIOUS_HEAD: ${{ github.event.before }}
        run: |
          if [ "$EVENT_ACTION" = "synchronize" ] && git cat-file -e "${PREVIOUS_HEAD}^{commit}" 2>/dev/null; then
            echo "sha=$PREVIOUS_HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            evaluator:
              - 'hand-evaluator/**'
              - '.github/workflows/docker-image.yml'
            server:
              - 'server/**'
              - '.github/workflows/docker-image.yml'

  build-evaluator:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.build_evaluator) ||
        github.event_name == 'schedule' ||
        startsWith(github.ref, 'refs/tags/') ||
        needs.changes.outputs.evaluator == 'true'
      )
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login against a Docker registry except on PRs from forks
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/just-hand-evaluator
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ./hand-evaluator
          file: ./hand-evaluator/Dockerfile
          push: ${{ env.PUSH_IMAGE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  build-server:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.build_server) ||
        github.event_name == 'schedule' ||
        startsWith(github.ref, 'refs/tags/') ||
        needs.changes.outputs.server == 'true'
      )
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/just-poker-server
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          secrets: |
            netrc=machine github.com login x-access-token password ${{ secrets.JUST_SERVICES_READ_TOKEN }}
          push: ${{ env.PUSH_IMAGE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max