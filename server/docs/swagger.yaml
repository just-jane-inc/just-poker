components:
  schemas:
    admin.GameStatus:
      enum:
      - paused
      - normal
      type: string
      x-enum-varnames:
      - GameStatusPaused
      - GameStatusNormal
    admin.GameStatusDTO:
      properties:
        status:
          $ref: '#/components/schemas/admin.GameStatus'
      type: object
    game.ActiveGameDTO:
      properties:
        id:
          type: string
        player_ids:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    game.CardDTO:
      properties:
        rank:
          description: the rank of a card as a rune - int32 ASCII encoding
          type: integer
        suit:
          description: the suit of a card as a rune - int32 ASCII encoding
          type: integer
      type: object
    game.ChipExchangeDTO:
      properties:
        give:
          $ref: '#/components/schemas/game.ChipStackDTO'
        receive:
          $ref: '#/components/schemas/game.ChipStackDTO'
      type: object
    game.ChipStackDTO:
      additionalProperties:
        type: integer
      description: an optional mapping of chips that is required by some action types.
      type: object
    game.GameDTO:
      properties:
        ended_at:
          description: the time that the game ended
          type: string
        game_config:
          $ref: '#/components/schemas/game.NewGameConfigDTO'
        id:
          description: the id of the game
          type: string
        started_at:
          description: the time that the game started originally
          type: string
        table:
          $ref: '#/components/schemas/game.TableDTO'
      type: object
    game.HandDTO:
      description: the current hand
      properties:
        big_blind:
          description: the amount of chips for the big blind in this hand
          type: integer
        id:
          description: the (non decreasing) hand counter
          type: integer
        small_blind:
          description: the amount of chips for the small blind in this hand
          type: integer
        started_at:
          description: the time that this hand started
          type: string
      type: object
    game.NewGameConfigDTO:
      description: the configuration used to setup the game
      properties:
        big_blind:
          description: the big blind
          type: integer
        player_count:
          description: the number of players (max) the game supports
          type: integer
        small_blind:
          description: the small blind
          type: integer
        starting_chips:
          $ref: '#/components/schemas/game.ChipStackDTO'
      type: object
    game.PlayerActionDTO:
      properties:
        accepted_at:
          description: a timestamp capturing when a succesful action was accepted
            by the game
          type: string
        chips:
          $ref: '#/components/schemas/game.ChipStackDTO'
        intent:
          description: the type of action a player intended to preform
          type: string
        player_id:
          description: the id of the player preforming the action
          type: string
      type: object
    game.PlayerDTO:
      properties:
        current_bet:
          $ref: '#/components/schemas/game.ChipStackDTO'
        display_name:
          description: the users display name
          type: string
        hole:
          description: |-
            the cards current held by this player - only visible for authorized users
            during a game.
          items:
            $ref: '#/components/schemas/game.CardDTO'
          type: array
          uniqueItems: false
        position:
          description: |-
            the players position at the table, starting with 0 being the
            first player sitting clockwise from the dealer
          type: integer
        pot_contribution:
          description: |-
            the sum total the player has contributed to the pot, note that this
            does not include chips currently in CurrentBet
          type: integer
        stack:
          $ref: '#/components/schemas/game.ChipStackDTO'
        state:
          description: the players state
          type: string
        user_id:
          description: the id of the user
          type: string
        user_type:
          $ref: '#/components/schemas/just.UserType'
      type: object
    game.RoundDTO:
      description: the current round
      properties:
        bet:
          description: the amount of chips required to call (how does this work with
            split pots?)
          type: integer
        current_aggressor:
          description: the player who currently ends the round? the last raise?
          type: integer
        current_player_position:
          description: the index into the play array for the player whose turn it
            currently is
          type: integer
        current_round_type:
          $ref: '#/components/schemas/game.RoundType'
      type: object
    game.RoundType:
      description: the type of round
      enum:
      - unset
      - setup
      - pre_flop
      - flop
      - turn
      - river
      - completed
      type: string
      x-enum-varnames:
      - RoundTypeUnset
      - RoundTypeAnte
      - RoundTypePreFlop
      - RoundTypeFlop
      - RoundTypeTurn
      - RoundTypeRiver
      - RoundTypeCompleted
    game.TableDTO:
      description: the table
      properties:
        big_blind_position:
          description: the position of the big blind
          type: integer
        button_position:
          description: the position of the button
          type: integer
        current_hand:
          $ref: '#/components/schemas/game.HandDTO'
        current_round:
          $ref: '#/components/schemas/game.RoundDTO'
        players:
          description: An array of players at the table
          items:
            $ref: '#/components/schemas/game.PlayerDTO'
          type: array
          uniqueItems: false
        pot:
          $ref: '#/components/schemas/game.ChipStackDTO'
        small_blind_position:
          description: the position of the small blind
          type: integer
        street:
          description: the cards that are on the street (community cards)
          items:
            $ref: '#/components/schemas/game.CardDTO'
          type: array
          uniqueItems: false
      type: object
    just.ErrorDTO:
      properties:
        error:
          type: string
        error_code:
          type: integer
      type: object
    just.ResponseMessage-any:
      properties:
        data: {}
        type:
          example: user.created
          type: string
      type: object
    just.ResponseMessage-game_GameDTO:
      properties:
        data:
          $ref: '#/components/schemas/game.GameDTO'
        type:
          example: user.created
          type: string
      type: object
    just.ResponseMessage-just_ErrorDTO:
      properties:
        data:
          $ref: '#/components/schemas/just.ErrorDTO'
        type:
          example: user.created
          type: string
      type: object
    just.ResponseMessage-string:
      properties:
        data:
          type: string
        type:
          example: user.created
          type: string
      type: object
    just.UserType:
      description: the type of user
      enum:
      - bot
      - normal
      - admin
      - game_master
      type: string
      x-enum-varnames:
      - UserTypeBot
      - UserTypeHuman
      - UserTypeAdmin
      - UserTypeGameMaster
  securitySchemes:
    BearerAuth:
      description: Type "Bearer" followed by a space and your token (e.g. "Bearer
        your_token_here").
      scheme: bearer
      type: http
externalDocs:
  description: ""
  url: ""
info:
  description: |+
    # Error Format & Meaning

    All response messages are in the format of:
    ```json
    {
      "message_type": "string",
      "data": {}
    }
    ```

    All errors use the "error" message_type and have the data format of:
    ```json
    {
      "error_code": int,
      "error": "string"
    }
    ```


    The "error" field is intended only as a human readable message and should not be depended on for branching or parsing in code.
    This field should be considered volatile within the api.
    The error_code field is stable and intended for client code to use within recovery operations.
    The error codes and their meanings are enumerated in the table below


    |   Code | Name                  | Meaning                                       |
    | -----: | --------------------- | --------------------------------------------- |
    | `1000` | `Unknown` | A novel error...congrats.                |
    | `1001` | `TurnOrderViolation`     | Player action received for a player out of turn. |
    | `1002` | `InvalidActionType`   | Player action received with an intent that is not valid for the game state.                        |
    | `1003` | `NotEnoughChips`   | Player action received with a chip amount that cannot be covered by the players stack            |
    | `1004` | `InvalidBetAmount`    | Player action received with a bet amount that violates requirements i.e. incorrect amount for a blind, call, or a raise which is too low.                 |


  termsOfService: http://swagger.io
  title: BAHMS Poker Tournament
  version: "1.0"
openapi: 3.1.0
paths:
  /admin/game/{game_id}/status:
    post:
      description: Changes the status of an active game, for use by admins
      parameters:
      - description: ID of the Game to update status of
        in: path
        name: game_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/admin.GameStatusDTO'
                description: the status of the game to set
                summary: status
        description: the status of the game to set
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: OK
        "400":
          description: Bad Request
      security:
      - BearerAuth: []
      summary: Update Game Status
      tags:
      - Admin
  /admin/game/{game_id}/table:
    post:
      description: Changes the state of an active game
      parameters:
      - description: ID of the Game to update status of
        in: path
        name: game_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/game.TableDTO'
                description: the table struct to apply
                summary: status
        description: the table struct to apply
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: OK
        "400":
          description: Bad Request
      security:
      - BearerAuth: []
      summary: Change Game Table
      tags:
      - Admin
  /game:
    get:
      description: gets all games that are currently being played
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/game.ActiveGameDTO'
                type: array
          description: OK
      summary: Gets Active Games
      tags:
      - Game
    post:
      description: creates a new game from a configuration file
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/game.NewGameConfigDTO'
                description: an object defining configuration information for the
                  new game
                summary: request
        description: an object defining configuration information for the new game
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/just.ResponseMessage-string'
          description: game created - game id as string
      security:
      - BearerAuth: []
      summary: Create Game
      tags:
      - Game
  /game/{game_id}/action:
    post:
      description: post the action preformed by a player
      parameters:
      - description: the id of the game
        in: path
        name: game_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/game.PlayerActionDTO'
                description: the action the player is preforming
                summary: request
        description: the action the player is preforming
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/just.ResponseMessage-any'
          description: OK
      security:
      - BearerAuth: []
      summary: Player Action
      tags:
      - Game
  /game/{game_id}/chip/exchange:
    post:
      description: exchange chips in the players stack with the tables rack
      parameters:
      - description: ID of the Game exchange chips in
        in: path
        name: game_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/game.ChipExchangeDTO'
                description: a specification for the chips to exchange
                summary: request
        description: a specification for the chips to exchange
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/just.ResponseMessage-any'
          description: OK
      security:
      - BearerAuth: []
      summary: Exchange Chips
      tags:
      - Game
  /game/{game_id}/player:
    post:
      description: Join an open game
      parameters:
      - description: ID of the Game to join
        in: path
        name: game_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/just.ResponseMessage-any'
          description: OK
      security:
      - BearerAuth: []
      summary: Join a Game
      tags:
      - Game
  /game/{game_id}/started:
    post:
      description: starts a game from a created game lobby, closing it to joins and
        starting play
      parameters:
      - description: the id of the game to start
        in: path
        name: game_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/just.ResponseMessage-any'
          description: OK
      security:
      - BearerAuth: []
      summary: Start Game
      tags:
      - Game
  /game/{game_id}/state:
    get:
      description: gets the current state of the game from the perspective of the
        requesting user
      parameters:
      - description: ID of the Game to get the state of
        in: path
        name: game_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/just.ResponseMessage-game_GameDTO'
          description: OK
      security:
      - BearerAuth: []
      summary: Game State
      tags:
      - Game
  /game/{game_id}/state/listen:
    get:
      description: creates a listener that will begin buffering game events that can
        be queried from an endpoint
      parameters:
      - description: ID of the Game to get events from
        in: path
        name: game_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/game.GameDTO'
          description: OK
      summary: Get Listener
      tags:
      - Game
    post:
      description: creates a listener that will begin buffering game events that can
        be queried from an endpoint
      parameters:
      - description: ID of the Game to listen to
        in: path
        name: game_id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
      summary: Register Listener
      tags:
      - Game
  /game/{game_id}/state/ws:
    get:
      description: gets all game updates
      parameters:
      - description: ID of the Game to get events from
        in: path
        name: game_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: OK
      summary: Connect Updates
      tags:
      - Game
  /hand-evaluator/evaluate:
    post:
      description: Evaluator? I hardly...
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - items:
                  $ref: '#/components/schemas/game.CardDTO'
                title: hand
                type: array
        description: hand to evaluate, either 5 or 7 cards
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: OK
      summary: Evaluate a Hand
      tags:
      - Game
  /user/me:
    delete:
      description: deletes the user associated to the token used to authenticate this
        request
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/just.ResponseMessage-any'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/just.ResponseMessage-just_ErrorDTO'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/just.ResponseMessage-just_ErrorDTO'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/just.ResponseMessage-just_ErrorDTO'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/just.ResponseMessage-just_ErrorDTO'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/just.ResponseMessage-just_ErrorDTO'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: delete requesting user
      tags:
      - User
